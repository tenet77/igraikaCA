<h1>Виды доходов</h1>
<p style="MARGIN-LEFT: 0px">Справочник содержит перечень видов доходов. Справочник используется в качестве классификации видов расчета. В разрезе видов дохода также устанавливаются ставки ИПН ВОСМС и ООСМС.</p>
