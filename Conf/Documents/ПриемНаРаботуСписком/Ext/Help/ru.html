<h1>Прием на работу списком</h1>
<p style="MARGIN-LEFT: 0px">Документ предназначен для регистрации приема на работу нескольких сотрудников и для оформления печатной формы приказа о приеме.<br>Работа с каждой строкой документа аналогична работе с документом <a href="Document.ПриемНаРаботуСписком/Help">Прием на работу</a>, который предназначен для оформления только одного сотрудника.<br></p>
